name: Release ZIP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release title (optional)'
        required: false
        default: ''
      body:
        description: 'Release notes/body (optional)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease? (true/false)'
        required: false
        default: 'false'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for tag push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF##*/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create tag if missing (when dispatching)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          echo "Checking for tag $TAG"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create ZIP from tag
        id: zip
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          zipname="creative-crimes-${TAG}.zip"
          echo "Creating ZIP $zipname from $TAG"
          git archive --format=zip -o "$zipname" "$TAG"
          echo "zipfile=$zipname" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          release_name: ${{ github.event.inputs.release_name || steps.tag.outputs.tag }}
          body: ${{ github.event.inputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.zip.outputs.zipfile }}
          asset_name: ${{ steps.zip.outputs.zipfile }}
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release info
        run: |
          echo "Released tag: ${{ steps.tag.outputs.tag }}"
          echo "ZIP: ${{ steps.zip.outputs.zipfile }}"
          echo "Release URL: ${{ steps.create_release.outputs.html_url }}"
